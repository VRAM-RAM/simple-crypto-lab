[workspace]
resolver = "2"
members = [
    "simple-ring",
    "schemes/simple-bfv",
    "schemes/simple-saber",
    "examples/ring"
]

[workspace.dependencies]
rand = "0.8.0"
simple-ring = { version = "0.3.0" }

[workspace.package]
edition = "2024"
license = "CECILL-B OR Apache-2.0"
authors = ["Olruix (VRAM-RAM)"]
repository = "https://github.com/VRAM-RAM/simple-crypto-lab"

[patch.crates-io]
simple-ring = { path = "simple-ring" }
